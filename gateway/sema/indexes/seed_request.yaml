# Seed for the gateway's vendored sema snapshot (gateway/sema/), consumed by
# scripts/regen_sema_snapshot.sh. The vendored tree is generated: edit this
# file and re-run the script, never the tree.
#
# layout.lite lists two versions, the one the fleet sends and the one before
# it, so the gateway reads every house while a rollout moves through the
# scadas. Add the new version before the first box sends it and drop the
# oldest once the last box has moved.
#
# No `staging` block: the gateway is deployed from main and its snapshot
# holds published words only; a staging word the closure reaches fails the
# build.
package_name: gateway
vendor_dir: sema

initial_targets:
  types:
    gw: {}
    report.event:
      versions: ["002", "003", "004"]
    layout.lite:
      versions: ["013", "014"]
    snapshot.spaceheat:
      versions: ["003"]
