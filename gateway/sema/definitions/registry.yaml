metadata:
  registry_version: "1.0"
  last_updated: "2026-11-24T18:40:00Z"
  maintainer: "gridworks-energy"

formats:
  handle.name:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/handle.name"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "Dot-separated hierarchical identifier with hyphen-friendly lowercase segments"

  hh.mm:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/hh.mm"
    created: "2026-08-12T22:15:00Z"
    status: "published"
    description: "Wall-clock time of day at minute resolution, 24-hour zero-padded HH:MM (00:00 through 23:59); timezone-free"

  iana.timezone.str:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/iana.timezone.str"
    created: "2026-09-17T20:10:00Z"
    status: "published"
    description: "Shape of an IANA tz-database identifier: one to three slash-separated segments of letters, digits, underscore, plus, or minus (e.g. America/New_York, Etc/GMT+5, UTC); validates shape only, not membership in the current tz database"

  left.right.dot:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/left.right.dot"
    created: "2022-01-01T00:00:00Z"
    status: "published"
    description: "Dot-separated hierarchical identifier composed of lowercase alphanumeric segments"

  positive.int:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/positive.int"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "Positive integer with non-coercive serialized validation"

  sema.version:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/sema.version"
    created: "2026-10-22T20:00:00Z"
    status: "published"
    description: "Three-digit version string of a versioned Sema vocabulary word"

  spaceheat.name:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/spaceheat.name"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "Single-segment lowercase identifier with optional internal hyphen-separated words"

  utc.milliseconds:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/utc.milliseconds"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "UTC timestamp in whole milliseconds since Unix epoch (2000–3000 range)"

  utc.seconds:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/utc.seconds"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "UTC timestamp in whole seconds since Unix epoch (2000–3000 range)"

  uuid4.str:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/uuid4.str"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "Canonical lowercase UUIDv4 string (RFC 4122) in 8-4-4-4-12 format"

enums:
  day.of.week:
    owner: gridworks-energy
    enum_type: "literal"
    description: "Day of the civil week, for schedules that bind behavior to particular days (e.g. time-of-use windows)."
    schema_url: "https://schemas.electricity.works/enums/day.of.week/000"
    created: "2026-08-12T22:15:00Z"
    status: "published"

  fsm.report.type:
    owner: gridworks-energy
    enum_type: "literal"
    description: "Enumeration of atomic FSM report categories."
    schema_url: "https://schemas.electricity.works/enums/fsm.report.type/000"
    created: "2024-10-08T17:17:00Z"
    status: "published"

  gw1.actor.class:
    latest_version: "014"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Classification of actors in the GridWorks SCADA system."

    versions:
      "014":
        schema_url: "https://schemas.electricity.works/enums/gw1.actor.class/014"
        created: "2026-09-08T21:20:00Z"
        status: "published"
        added_values:
          - "FiveVBoss"
          - "HpWatch"
          - "ColdWatch"

  gw1.emission.method:
    latest_version: "000"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Method by which a derived or computed channel emits values."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/gw1.emission.method/000"
        created: "2026-02-02T22:17:00Z"
        status: "published"

  gw1.quantity:
    latest_version: "003"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "High-level physical or semantic quantity classification for telemetry values."

    versions:
      "003":
        schema_url: "https://schemas.electricity.works/enums/gw1.quantity/003"
        created: "2026-10-15T11:35:00Z"
        status: "published"
        added_values:
          - "Irradiance"
          - "Currency"

  gw1.unit:
    latest_version: "003"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Measurement-unit vocabulary used for derived channels."

    versions:
      "003":
        schema_url: "https://schemas.electricity.works/enums/gw1.unit/003"
        created: "2026-10-15T11:35:00Z"
        status: "published"
        added_values:
          - "WattsPerSquareMeter"
          - "MilesPerHourX10"
          - "FahrenheitX10"

  relay.closed.or.open:
    owner: gridworks-energy
    enum_type: "literal"
    description: "FSM states for a simple relay with open and closed positions."
    schema_url: "https://schemas.electricity.works/enums/relay.closed.or.open/000"
    created: "2024-09-17T20:17:00Z"
    status: "published"

  relay.energization.state:
    owner: gridworks-energy
    enum_type: "literal"
    value_type: "integer"
    description: "Two-state relay energization state."
    schema_url: "https://schemas.electricity.works/enums/relay.energization.state/000"
    created: "2024-03-06T22:07:00Z"
    status: "published"

  spaceheat.telemetry.name:
    latest_version: "007"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Legacy Spaceheat telemetry-name vocabulary for raw channels."

    versions:
      "007":
        schema_url: "https://schemas.electricity.works/enums/spaceheat.telemetry.name/007"
        created: "2024-12-06T00:00:00Z"
        status: "published"
        added_values:
          - "BinaryState"

types:
  channel.readings:
    latest_version: "002"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Timestamped integer readings for one channel within a SCADA reporting context."

    versions:
      "002":
        schema_url: "https://schemas.electricity.works/types/channel.readings/002"
        created: "2024-10-12T17:43:44Z"
        status: "published"
        summary: "- ChannelId: remove - additionalProperties: true -> false"
        direct_dependencies:
          structural:
            - "spaceheat.name"
            - "utc.milliseconds"

  data.channel.gt:
    latest_version: "004"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Canonical definition of a telemetry channel representing directly captured measurements"

    versions:
      "004":
        schema_url: "https://schemas.electricity.works/types/data.channel.gt/004"
        created: "2026-10-15T16:00:00Z"
        status: "published"
        summary: "- Quantity: gw1.quantity 000 -> 003 - TelemetryQuantityConsistency axiom: spaceheat.telemetry.quantity.projection 000 -> 001"
        direct_dependencies:
          structural:
            - "gw1.quantity:003"
            - "left.right.dot"
            - "spaceheat.name"
            - "spaceheat.telemetry.name:007"
            - "utc.seconds"
            - "uuid4.str"
          axiom:
            - "spaceheat.telemetry.quantity.projection:001"

  derived.channel.gt:
    latest_version: "003"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Canonical definition of computed telemetry channels within a GridWorks system."

    versions:
      "003":
        schema_url: "https://schemas.electricity.works/types/derived.channel.gt/003"
        created: "2026-10-15T11:35:00Z"
        status: "published"
        summary: "- OutputUnit: gw1.unit 001 -> 003 - OutputQuantity: gw1.quantity 001 -> 003 - OutputUnitQuantityConsistency axiom: gw1.unit.quantity.projection 000 -> 001"
        direct_dependencies:
          structural:
            - "gw1.emission.method:000"
            - "gw1.quantity:003"
            - "gw1.unit:003"
            - "left.right.dot"
            - "positive.int"
            - "spaceheat.name"
            - "uuid4.str"
          axiom:
            - "gw1.unit.quantity.projection:001"

  fsm.atomic.report:
    latest_version: "001"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Single atomic FSM report item representing either an event or an action."

    versions:
      "001":
        schema_url: "https://schemas.electricity.works/types/fsm.atomic.report/001"
        created: "2025-04-23T18:03:00Z"
        status: "published"
        summary: "- ActionType: remove - Action: scalar -> unconstrained object payload"
        direct_dependencies:
          structural:
            - "fsm.report.type:000"
            - "handle.name"
            - "left.right.dot"
            - "utc.milliseconds"
            - "uuid4.str"
          axiom:
            - "relay.energization.state:000"
      "000":
        schema_url: "https://schemas.electricity.works/types/fsm.atomic.report/000"
        created: "2024-10-08T17:17:00Z"
        status: "published"
        summary: "Initial Sema version"
        direct_dependencies:
          structural:
            - "fsm.report.type:000"
            - "handle.name"
            - "left.right.dot"
            - "utc.milliseconds"
            - "uuid4.str"

  fsm.full.report:
    latest_version: "001"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Full FSM report emitted for one trigger, including its ordered atomic report items."

    versions:
      "001":
        schema_url: "https://schemas.electricity.works/types/fsm.full.report/001"
        created: "2025-04-23T18:03:00Z"
        status: "published"
        summary: "- AtomicList[]: fsm.atomic.report:000 -> 001"
        direct_dependencies:
          structural:
            - "fsm.atomic.report:001"
            - "spaceheat.name"
            - "uuid4.str"
      "000":
        schema_url: "https://schemas.electricity.works/types/fsm.full.report/000"
        created: "2024-10-08T17:41:00Z"
        status: "published"
        summary: "Initial Sema version"
        direct_dependencies:
          structural:
            - "fsm.atomic.report:000"
            - "spaceheat.name"
            - "uuid4.str"

  gridworks.header:
    latest_version: "001"
    owner: smoothstone-computing
    versioning_strategy: "literal"
    description: "Delivery-layer metadata carried inside a gw envelope: Src, Dst, MessageType, MessageId, AckRequired."

    versions:
      "001":
        schema_url: "https://schemas.electricity.works/types/gridworks.header/001"
        created: "2022-10-17T16:55:39Z"
        status: "published"
        summary: "Initial published version, matching the gwproto Header wire format deployed in the field."
        direct_dependencies:
          structural:
            - "left.right.dot"

  gw.state.machine:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Declaration of one state machine a running SCADA hosts: hosting node Name, state enum and its version."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/gw.state.machine/000"
        created: "2026-10-22T20:00:00Z"
        status: "published"
        summary: "Initial version."
        direct_dependencies:
          structural:
            - "left.right.dot"
            - "sema.version"
            - "spaceheat.name"

  gw.tou.tariff:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "A time-of-use tariff as the heating system sees it: Alias, DisplayName, TimezoneStr (iana.timezone.str) and the recurring on-peak windows; every other hour is off-peak."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/gw.tou.tariff/000"
        created: "2026-09-17T20:10:00Z"
        status: "published"
        summary: "Initial version: Alias (left.right.dot), DisplayName, TimezoneStr (iana.timezone.str, the new format word replacing a bare string), OnPeakWindows (gw.tou.window list). Axiom 1: per-day window non-overlap (moved here from the two operational-params words)."
        direct_dependencies:
          structural:
            - "gw.tou.window:000"
            - "iana.timezone.str"
            - "left.right.dot"

  gw.tou.window:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "One recurring time-of-use window: a same-day wall-clock interval (hh.mm Start/End) bound to an explicit set of weekdays."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/gw.tou.window/000"
        created: "2026-08-12T22:15:00Z"
        status: "published"
        summary: "Initial version: Start (inclusive) and End (exclusive) hh.mm plus Days (day.of.week list). Axioms: Start strictly before End (no midnight wrap); Days non-empty and duplicate-free."
        direct_dependencies:
          structural:
            - "day.of.week:000"
            - "hh.mm"

  gw1.unit.quantity.projection:
    latest_version: "001"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Canonical projection from gw1.unit to gw1.quantity."

    versions:
      "001":
        schema_url: "https://schemas.electricity.works/types/gw1.unit.quantity.projection/001"
        created: "2026-10-15T11:35:00Z"
        status: "published"
        summary: "- Unit: gw1.unit 001 -> 003 - Quantity: gw1.quantity 001 -> 003 - projection.table: add DollarsX1000 -> Currency, MilesPerHourX1000 -> WindSpeed, KilowattHoursX1000 -> Energy, WattsPerSquareMeter -> Irradiance"
        direct_dependencies:
          structural:
            - "gw1.quantity:003"
            - "gw1.unit:003"

  layout.lite:
    latest_version: "014"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Runtime projection of the active SCADA context used to interpret reports, snapshots, and control-adjacent messages."

    versions:
      "014":
        schema_url: "https://schemas.electricity.works/types/layout.lite/014"
        created: "2026-11-13T17:25:00Z"
        status: "published"
        summary: "- Tariff: add (gw.tou.tariff 000), the time-of-use tariff the home is billed on, as the running scada's operational params state it; a reader lays its on-peak windows over any time range without a hand-kept copy."
        direct_dependencies:
          structural:
            - "data.channel.gt:004"
            - "derived.channel.gt:003"
            - "gw.state.machine:000"
            - "gw.tou.tariff:000"
            - "left.right.dot"
            - "spaceheat.node.gt:303"
            - "utc.milliseconds"
            - "uuid4.str"
      "013":
        schema_url: "https://schemas.electricity.works/types/layout.lite/013"
        created: "2026-10-22T20:10:00Z"
        status: "published"
        summary: "- ShNodes: spaceheat.node.gt:301 -> 303 - DataChannels: data.channel.gt:002 -> 004 - TankModuleComponents, FlowModuleComponents and TMap leave: no consumer reads the pico components or the calibration map off the projection; the hardware layout is their source. - I2cRelayComponent leaves: the relay component is read off the hardware layout, and the projection has no reader for it. - SystemMode and SeasonalStorageMode leave: the posture facts (Standby, StandbyPosture, SeasonalStorageMode, ServiceMode, AcceptsDispatch, DispatchRefusalReason) ride gw.house.operating.status, sent after the startup announcements and on change, so the LTN has one source for them. - Strategy (free manifold-variant string) -> HardwareLayoutTypeName (left.right.dot): the loaded layout word's TypeName is the family; a format, not an enum of layout words, so this word publishes independently of the layout words' status. - BufferShortCycling, Ha1Params and TotalStoreTanks leave: operational parameters are not layout; the LTN gets them from its own settings and its own hardware layout until it holds the ops word, and a layout with no store tanks cannot fill a positive tank count. - MessageCreatedMs -> CreatedMs: the sender-clock name every word takes by default. - StateMachines: one gw.state.machine per machine the running scada hosts (hosting node Name, state enum, enum version), so a report's MachineHandle resolves by its last dotted segment to a declared, versioned enum."
        direct_dependencies:
          structural:
            - "data.channel.gt:004"
            - "derived.channel.gt:003"
            - "gw.state.machine:000"
            - "left.right.dot"
            - "spaceheat.node.gt:303"
            - "utc.milliseconds"
            - "uuid4.str"

  machine.states:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Sequence of machine states observed for one state machine during a reporting interval."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/machine.states/000"
        created: "2024-11-09T16:36:00Z"
        status: "published"
        summary: "Initial Sema version"
        direct_dependencies:
          structural:
            - "handle.name"
            - "left.right.dot"
            - "utc.milliseconds"
          axiom:
            - "relay.closed.or.open:000"

  report:
    latest_version: "003"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Primary telemetry and state reporting message produced by a SCADA node for a specific reporting slot."

    versions:
      "003":
        schema_url: "https://schemas.electricity.works/types/report/003"
        created: "2026-03-30T19:01:47Z"
        status: "published"
        summary: "- FsmReportList[]: fsm.full.report:000 -> 001"
        direct_dependencies:
          structural:
            - "channel.readings:002"
            - "fsm.full.report:001"
            - "left.right.dot"
            - "machine.states:000"
            - "positive.int"
            - "utc.milliseconds"
            - "utc.seconds"
            - "uuid4.str"
      "002":
        schema_url: "https://schemas.electricity.works/types/report/002"
        created: "2025-04-23T18:03:00Z"
        status: "published"
        summary: "- StateList: add (machine.states:000) - FsmActionList: remove - FsmReportList[]: fsm.full.report:000 -> oneOf[000, 001]"
        direct_dependencies:
          structural:
            - "channel.readings:002"
            - "fsm.full.report:000"
            - "fsm.full.report:001"
            - "left.right.dot"
            - "machine.states:000"
            - "positive.int"
            - "utc.milliseconds"
            - "utc.seconds"
            - "uuid4.str"

  report.event:
    latest_version: "004"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Event wrapper for a report payload with message tracking metadata."

    versions:
      "004":
        status: "published"
        schema_url: "https://schemas.electricity.works/types/report.event/004"
        created: "2026-05-06T00:00:00Z"
        summary: "- Axioms: reinstate ReportIdentityPropagation, ReportCreatedTimePropagation and ReportSourcePropagation"
        direct_dependencies:
          structural:
            - "left.right.dot"
            - "report:003"
            - "utc.milliseconds"
            - "uuid4.str"
      "003":
        schema_url: "https://schemas.electricity.works/types/report.event/003"
        created: "2026-03-30T19:01:47Z"
        status: "published"
        summary: "- Report: report:002 -> 003 - Axioms: remove former ReportIdentityPropagation and ReportCreatedTimePropagation"
        direct_dependencies:
          structural:
            - "left.right.dot"
            - "report:003"
            - "utc.milliseconds"
            - "uuid4.str"
      "002":
        schema_url: "https://schemas.electricity.works/types/report.event/002"
        created: "2025-04-23T18:03:00Z"
        status: "published"
        summary: "- Report: report:001 -> 002"
        direct_dependencies:
          structural:
            - "left.right.dot"
            - "report:002"
            - "utc.milliseconds"
            - "uuid4.str"

  single.machine.state:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Latest known state for a single state machine at a specific timestamp."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/single.machine.state/000"
        created: "2026-03-30T19:01:47Z"
        status: "published"
        summary: "Initial Sema version"
        direct_dependencies:
          structural:
            - "handle.name"
            - "left.right.dot"
            - "utc.milliseconds"
          axiom:
            - "relay.closed.or.open:000"

  single.reading:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Latest known reading for a single channel at a specific SCADA read time."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/single.reading/000"
        created: "2024-11-08T00:00:00Z"
        status: "published"
        summary: "Initial Sema version"
        direct_dependencies:
          structural:
            - "spaceheat.name"
            - "utc.milliseconds"

  snapshot.spaceheat:
    latest_version: "003"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Point-in-time snapshot containing the latest known readings and machine states captured by a Spaceheat SCADA."

    versions:
      "003":
        schema_url: "https://schemas.electricity.works/types/snapshot.spaceheat/003"
        created: "2026-03-30T19:01:47Z"
        status: "published"
        summary: "LatestStateList element: machine.states -> single.machine.state (one state per entry, adds Cause; drops the parallel StateList/UnixMsList arrays). Type moved from gwproto to scada."
        direct_dependencies:
          structural:
            - "left.right.dot"
            - "single.machine.state:000"
            - "single.reading:000"
            - "utc.milliseconds"
            - "uuid4.str"

  spaceheat.node.gt:
    latest_version: "303"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "A Spaceheat node representing a named element in the SCADA system."

    versions:
      "303":
        schema_url: "https://schemas.electricity.works/types/spaceheat.node.gt/303"
        created: "2026-09-08T21:20:00Z"
        status: "published"
        summary: "- ActorClass: gw1.actor.class:013 -> 014 (adds FiveVBoss)"
        direct_dependencies:
          structural:
            - "gw1.actor.class:014"
            - "handle.name"
            - "positive.int"
            - "spaceheat.name"
            - "uuid4.str"

  spaceheat.telemetry.quantity.projection:
    latest_version: "001"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Canonical projection from legacy TelemetryName encodings to gw1.quantity."

    versions:
      "001":
        schema_url: "https://schemas.electricity.works/types/spaceheat.telemetry.quantity.projection/001"
        created: "2026-10-15T16:00:00Z"
        status: "published"
        summary: "- Quantity: gw1.quantity 000 -> 003"
        direct_dependencies:
          structural:
            - "gw1.quantity:003"
            - "spaceheat.telemetry.name:007"

  gw:
    owner: smoothstone-computing
    versioning_strategy: "none"
    description: "GridWorks message envelope: a gridworks.header plus a Payload of any registered Sema type."
    schema_url: "https://schemas.electricity.works/types/gw"
    created: "2022-10-17T16:55:39Z"
    status: "published"
    summary: "Versionless GridWorks message envelope (gwproto Message wire format)."
    direct_dependencies:
      structural:
        - "gridworks.header:001"
