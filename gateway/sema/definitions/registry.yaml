  layout.lite:
    latest_version: "013"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Runtime projection of the active SCADA context used to interpret reports, snapshots, and control-adjacent messages."

    versions:
      "013":
        schema_url: "https://schemas.electricity.works/types/layout.lite/013"
        created: "2026-10-22T20:10:00Z"
        status: "published"
        summary: "- ShNodes: spaceheat.node.gt:301 -> 303 - DataChannels: data.channel.gt:002 -> 004 - TankModuleComponents, FlowModuleComponents and TMap leave: no consumer reads the pico components or the calibration map off the projection; the hardware layout is their source. - I2cRelayComponent leaves: the relay component is read off the hardware layout, and the projection has no reader for it. - SystemMode and SeasonalStorageMode leave: the posture facts (Standby, StandbyPosture, SeasonalStorageMode, ServiceMode, AcceptsDispatch, DispatchRefusalReason) ride gw.house.operating.status, sent after the startup announcements and on change, so the LTN has one source for them. - Strategy (free manifold-variant string) -> HardwareLayoutTypeName (left.right.dot): the loaded layout word's TypeName is the family; a format, not an enum of layout words, so this word publishes independently of the layout words' status. - BufferShortCycling, Ha1Params and TotalStoreTanks leave: operational parameters are not layout; the LTN gets them from its own settings and its own hardware layout until it holds the ops word, and a layout with no store tanks cannot fill a positive tank count. - MessageCreatedMs -> CreatedMs: the sender-clock name every word takes by default. - StateMachines: one gw.state.machine per machine the running scada hosts (hosting node Name, state enum, enum version), so a report's MachineHandle resolves by its last dotted segment to a declared, versioned enum."
        direct_dependencies:
          structural:
            - "data.channel.gt:004"
            - "derived.channel.gt:003"
            - "gw.state.machine:000"
            - "left.right.dot"
            - "spaceheat.node.gt:303"
            - "utc.milliseconds"
            - "uuid4.str"
      "012":
        schema_url: "https://schemas.electricity.works/types/layout.lite/012"
        created: "2026-03-31T10:42:00Z"
        status: "published"
        summary: "- DerivedChannels[]: derived.channel.gt:000 | 001 -> 001 - DataChannels[]: data.channel.gt:001 -> 002 - Ha1Params: ha1.params:004 | 005 | 006 -> ha1.params:006 - I2cRelayComponent: i2c.multichannel.dt.relay.component.gt:002 -> 003 - ShNodes[]: spaceheat.node.gt:300 | 301 -> 301"
        direct_dependencies:
          structural:
            - "data.channel.gt:002"
            - "derived.channel.gt:001"
            - "gw1.seasonal.storage.mode:000"
            - "gw1.system.mode:000"
            - "gw1.tank.temp.calibration.map:000"
            - "ha1.params:006"
            - "i2c.multichannel.dt.relay.component.gt:003"
            - "left.right.dot"
            - "pico.flow.module.component.gt:000"
            - "pico.tank.module.component.gt:011"
            - "positive.int"
            - "sim.pico.tank.module.component.gt:000"
            - "spaceheat.node.gt:301"
            - "utc.milliseconds"
            - "uuid4.str"
