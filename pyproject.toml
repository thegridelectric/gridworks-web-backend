[project]
name = "gridworks-web-backend"
version = "0.1.0"
description = "GridWorks web backend: REST API and realtime gateway"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gridworks-flo",
    "python-multipart",
    "asyncpg",
    "psycopg2-binary>=2.9.9",
    "pandas>=2.3.3",
    "numpy>=2.3.3",
    "async-timeout",
    "pendulum",
    "sqlalchemy",
    "fastapi",
    "uvicorn",
    "websockets",
    "pytz",
    "python-dotenv",
    "httpx",
    "pydantic>=2.0.0",
    "python-jose[cryptography]",
    "matplotlib",
    "plotly",
    "bcrypt",
    "pydantic-settings",
    "reportlab",
    "aio-pika",
    "gw-data>=0.8.0",
    "aioitertools>=0.13.0",
]

[tool.uv]
package = false
default-groups = []

[dependency-groups]
dev = [
    "greenlet",  # sqlalchemy asyncio; its own marker skips macOS arm64
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyyaml",
    "testcontainers>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
gridworks-flo = { path = "../gridworks-innovations/gridworks-flo", editable = true }
