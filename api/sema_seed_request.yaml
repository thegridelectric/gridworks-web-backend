# seed_request_template.yaml

# List of root targets for closure expansion.
# Each entry must be:
#   - "<type_or_enum>:<version>"
#   - "<format_name>" (for formats)

initial_targets:
  types:
    synced.readings.bundle: {}
    snapshot.spaceheat:
      include_all_versions: true
    layout.lite:
      include_all_versions: true
    glitch:
      include_all_versions: true
    gridworks.event.problem:
      include_all_versions: true
    gw.house.summary:
      include_all_versions: true
    # The stopgap price forecast the price-forecast route forwards to the
    # visualizer's price panel; retires with the service's own word.
    gw.stopgap.price.forecast: {}
    # The fleet's time-of-use tariff the tou-tariff route serves to the
    # visualizer's price panel for its on-peak shading.
    gw.tou.tariff: {}
    # The weather service's emissions and the bundle record that keys them,
    # served by the weather-forecast routes to the visualizer's weather panel.
    # Both versions the journal holds: 001 rows have no ForecastUid.
    gw.weather.forecast:
      versions: ["001", "002"]
    gw.weather.forecast.bundle.gt: {}

  enums:
    # The kind of each reading_channels row (channel_type): the readers pick
    # state rows by it.
    gw.channel.kind: {}
    # Every enum a state channel can be typed by (reading_channels.unit_type),
    # all versions: the readings csv resolves a stored state position to its
    # symbol through (enum name, version).
    aquastat.control.state:
      include_all_versions: true
    five.v.boss.state:
      include_all_versions: true
    gw.top.state:
      include_all_versions: true
    gw1.lc.top.state:
      include_all_versions: true
    gw1.leaf.ally.all.tanks.state:
      include_all_versions: true
    gw1.leaf.ally.buffer.only.state:
      include_all_versions: true
    gw1.local.control.all.tanks.state:
      include_all_versions: true
    gw1.local.control.buffer.only.state:
      include_all_versions: true
    gw1.main.auto.state:
      include_all_versions: true
    gw1.nolan.lc.buffer.only.state:
      include_all_versions: true
    gw2.lc.top.state:
      include_all_versions: true
    heat.pump.control:
      include_all_versions: true
    hp.boss.state:
      include_all_versions: true
    hp.loop.keep.send:
      include_all_versions: true
    pico.cycler.state:
      include_all_versions: true
    primary.pump.control:
      include_all_versions: true
    relay.closed.or.open:
      include_all_versions: true
    sieg.valve.state:
      include_all_versions: true
    single.pico.state:
      include_all_versions: true
    spruce.hack.hp.state:
      include_all_versions: true
    store.flow.relay:
      include_all_versions: true
    valve.open.or.closed:
      include_all_versions: true
    zone.call.source:
      include_all_versions: true

# Local class/module names drop the gw ceremony inside this package:
# gw.weather.channel.gt -> WeatherChannelGt, gw.house.summary -> HouseSummary.
# Wire TypeNames are untouched.
local_names:
  strip_prefixes: [gw]
