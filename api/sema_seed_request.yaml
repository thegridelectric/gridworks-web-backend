# Seed for the api's vendored sema snapshot (api/sema/), regenerated by
# scripts/regen_sema_snapshot.sh. The vendored tree is generated: edit this
# file and re-run the script, never the tree.
#
# No `staging` block: the api is deployed from main and its snapshot holds
# published words only. A staging version a word stages is passed over by
# `include_all_versions` and reported at the build; a staging word the
# closure reaches fails the build.
package_name: api
vendor_dir: sema

initial_targets:
  types:
    synced.readings.bundle: {}
    snapshot.spaceheat:
      include_all_versions: true
    layout.lite:
      include_all_versions: true
    glitch:
      include_all_versions: true
    gridworks.event.problem:
      include_all_versions: true
    gw.house.summary:
      include_all_versions: true
    # The stopgap price forecast the price-forecast route forwards to the
    # visualizer's price panel; retires with the service's own word.
    gw.stopgap.price.forecast: {}
    # The weather service's emissions and the bundle record that keys them,
    # served by the weather-forecast routes to the visualizer's weather panel.
    # Both versions the journal holds: 001 rows have no ForecastUid.
    gw.weather.forecast:
      versions: ["001", "002"]
    gw.weather.forecast.bundle.gt: {}
    # The FLO service's answer to a house's request, served by the FLO route
    # to the visualizer's FLO view. The journal holds 000 to 003: 000 rows
    # have no store state and no penalties; 002 adds the unmet-load penalty;
    # 003 puts the penalty series under tuning in the penalties word's
    # Experimental dict.
    flo.recommendation:
      versions: ["000", "001", "002", "003"]
    # The LTN's request the recommendation answers, served by the FLO route
    # for the visualizer's price and load panels. The journal holds 001
    # to 005: 001 rows have two price lists and name no forecast; 002 on
    # name the gw.price.forecast their one list was read from; 004 keeps the
    # knobs under tuning in Experimental; 005 states the lift COP model.
    flo.params:
      versions: ["001", "002", "003", "004", "005"]
    # The visualizer's laptop re-solve POST body (not journaled). The panel
    # sends 003, whose Params may be any flo.params from 001 to 005; 000 to
    # 002 are the previous words.
    flo.rerun.request:
      versions: ["000", "001", "002", "003"]
    # The price service's forecast, journaled on its own id, served by the
    # price-forecast route for the visualizer's price panel.
    gw.price.forecast: {}
    # The MarketMaker's slot price, served by the latest-prices route for
    # the visualizer's price panel at the version the journal holds: 000
    # rows have the price alone, 001 rows its parts.
    latest.price:
      versions: ["000", "001"]

  enums:
    # The kind of each reading_channels row (channel_type): the readers pick
    # state rows by it.
    gw.channel.kind: {}
    # Every enum a state channel can be typed by (reading_channels.unit_type),
    # all versions: the readings csv resolves a stored state position to its
    # symbol through (enum name, version).
    aquastat.control.state:
      include_all_versions: true
    five.v.boss.state:
      include_all_versions: true
    gw.top.state:
      include_all_versions: true
    gw1.lc.top.state:
      include_all_versions: true
    gw1.leaf.ally.all.tanks.state:
      include_all_versions: true
    gw1.leaf.ally.buffer.only.state:
      include_all_versions: true
    gw1.local.control.all.tanks.state:
      include_all_versions: true
    gw1.local.control.buffer.only.state:
      include_all_versions: true
    gw1.main.auto.state:
      include_all_versions: true
    gw1.nolan.lc.buffer.only.state:
      include_all_versions: true
    gw2.lc.top.state:
      include_all_versions: true
    heat.pump.control:
      include_all_versions: true
    hp.boss.state:
      include_all_versions: true
    hp.loop.keep.send:
      include_all_versions: true
    pico.cycler.state:
      include_all_versions: true
    primary.pump.control:
      include_all_versions: true
    relay.closed.or.open:
      include_all_versions: true
    sieg.valve.state:
      include_all_versions: true
    single.pico.state:
      include_all_versions: true
    spruce.hack.hp.state:
      include_all_versions: true
    store.flow.relay:
      include_all_versions: true
    valve.open.or.closed:
      include_all_versions: true
    zone.call.source:
      include_all_versions: true

# Local class/module names drop the gw ceremony inside this package:
# gw.weather.channel.gt -> WeatherChannelGt, gw.house.summary -> HouseSummary.
# Wire TypeNames are untouched.
local_names:
  strip_prefixes: [gw]
